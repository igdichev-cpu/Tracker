<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning Tracker</title>
<style>
  html, body { margin:0; padding:0; background:#EBEEF6; overflow-x:hidden; }
  @media (prefers-color-scheme: dark) {
    html, body { background:#15161C; }
  }
</style>
</head>
<body>
<div id="app" class="pt-app">
  <div style="padding:40px; text-align:center;">Loading planning system…</div>
</div>

<style>
  #app.pt-app {
    --page-bg:#EBEEF6; --card:#FFFFFF; --border:#E6E8F1; --border-soft:#EFF1F8;
    --fg:#20232B; --muted:#8A8FA3; --chip:#F2F3F9; --chip-fg:#4B4F5E;
    --accent:#2F6FE4; --accent-fg:#FFFFFF; --accent-soft:#E7EFFE;
    --shadow: 0 1px 2px rgba(20,25,45,0.04), 0 8px 24px rgba(20,25,45,0.06);
    --green-bg:#E1F0D3; --green-fg:#33630F; --green-strong:#6EA82C;
    --yellow-bg:#FBEACB; --yellow-fg:#8A560C; --yellow-strong:#EFA531;
    --red-bg:#FADBDB; --red-fg:#8C2323; --red-strong:#E15C5B;
    --none-bg:#F0F1F7; --none-fg:#8A8FA3; --none-strong:#B7BACB;
    --star:#EFA531;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color:var(--fg); display:block; width:100%;
  }
  @media (prefers-color-scheme: dark) {
    #app.pt-app {
      --page-bg:#15161C; --card:#1E2027; --border:#2C2E38; --border-soft:#262832;
      --fg:#EDEEF3; --muted:#9A9EAF; --chip:#262832; --chip-fg:#C7C9D6;
      --accent:#4C86F0; --accent-fg:#0E1116; --accent-soft:#1E2A44;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.22);
      --green-bg:#1E3A0A; --green-fg:#C0DD97; --green-strong:#8FC24F;
      --yellow-bg:#4A2C05; --yellow-fg:#FAC775; --yellow-strong:#EFA531;
      --red-bg:#521717; --red-fg:#F7C1C1; --red-strong:#E15C5B;
      --none-bg:#262832; --none-fg:#9A9EAF; --none-strong:#4B4E5C;
      --star:#EFA531;
    }
  }
  #app * { box-sizing:border-box; }
  #app { line-height:1.55; }
  #app button { font-family:inherit; cursor:pointer; }
  #app input, #app textarea, #app select { font-family:inherit; color:var(--fg); }
  #app input::placeholder, #app textarea::placeholder { color:var(--muted); }
  #app .pt-shell { display:flex; gap:20px; width:100%; max-width:1440px; margin:0 auto; background:var(--page-bg); padding:20px; border-radius:20px; align-items:flex-start; }
  #app .pt-sidebar { width:224px; flex-shrink:0; background:var(--card); border-radius:16px; padding:18px 12px; box-shadow:var(--shadow); position:sticky; top:20px; max-height:calc(100vh - 40px); overflow-y:auto; }
  #app .pt-main { flex:1; min-width:0; background:var(--card); border-radius:16px; padding:26px 30px; box-shadow:var(--shadow); }
  #app .brand { display:flex; align-items:center; gap:9px; padding:6px 8px 18px; font-weight:700; font-size:15px; }
  #app .brand-mark { width:24px; height:24px; border-radius:7px; background:var(--accent); flex-shrink:0; }
  #app .navrow { display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 10px; border-radius:10px; border:none; background:transparent; color:var(--chip-fg); font-size:13px; font-weight:600; margin-bottom:2px; }
  #app .navrow:hover { background:var(--chip); }
  #app .navrow.active { background:var(--accent); color:var(--accent-fg); }
  #app .side-label { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; padding:16px 10px 6px; }
  #app .side-chip { display:block; width:100%; text-align:left; border:none; background:transparent; color:var(--chip-fg); font-size:13px; padding:7px 10px; border-radius:8px; margin-bottom:1px; }
  #app .side-chip:hover { background:var(--chip); }
  #app .side-chip.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  #app .card { background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); }
  #app .hairline { border-bottom:1px solid var(--border-soft); }
  #app .chip { border:1px solid var(--border); background:var(--chip); color:var(--chip-fg); border-radius:20px; padding:7px 15px; font-size:13px; font-weight:600; }
  #app .chip:hover { border-color:var(--accent); }
  #app .chip.active { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  #app .dot { width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0; }
  #app .pill { display:inline-flex; align-items:center; gap:6px; border-radius:20px; padding:4px 11px; font-size:12px; font-weight:600; }
  #app .status-btn { border-radius:8px; padding:0 6px; height:26px; display:flex; align-items:center; justify-content:center; }
  #app .star-btn { background:none; border:none; padding:2px; display:flex; align-items:center; flex-shrink:0; }
  #app .task-row { border-radius:10px; border:2px solid transparent; }
  #app .drag-handle { cursor:grab; color:var(--muted); display:flex; align-items:center; flex-shrink:0; }
  #app .drag-handle:active { cursor:grabbing; }
  #app .swatch { width:20px; height:20px; border-radius:50%; border:2px solid transparent; flex-shrink:0; -webkit-appearance:none; appearance:none; padding:0; margin:0; display:inline-flex; align-items:center; justify-content:center; }
  #app .swatch.selected { border-color:var(--fg); }
  #app .pt-sq-btn { -webkit-appearance:none; appearance:none; padding:0; margin:0; display:inline-flex; align-items:center; justify-content:center; }
  #app *:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #app h1.pt-title { font-size:19px; font-weight:700; margin:2px 0 3px; letter-spacing:-0.01em; }
  #app p.pt-subtitle { font-size:13px; color:var(--muted); margin:0 0 20px; }
  #app .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  #app .cal-head { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; text-align:left; padding:0 2px 6px; }
  #app .cal-cell { border-radius:10px; border:1px solid var(--border); background:var(--none-bg); min-height:78px; padding:8px; text-align:left; }
  #app .cal-cell.has-tasks { background:var(--card); border-color:var(--accent-soft); }
  #app .cal-cell.today { border-color:var(--accent); border-width:2px; }
  #app .cal-cell.out { opacity:.4; }
  #app .cal-nav-btn { width:30px; height:30px; border-radius:9px; background:var(--accent); color:var(--accent-fg); border:none; display:flex; align-items:center; justify-content:center; }
  #app .subgroup-head { display:flex; align-items:center; gap:8px; padding:10px 6px 4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  #app .add-row { display:flex; gap:6px; margin:2px 0 10px; }
  #app .goal-row { display:flex; align-items:center; gap:10px; padding:12px 4px; }
  #app .mobile-nav-btn { display:none; border:none; background:var(--chip); color:var(--fg); border-radius:9px; width:34px; height:34px; align-items:center; justify-content:center; flex-shrink:0; }
  #app .pt-topbar { display:flex; align-items:flex-start; gap:10px; }
  #app .pt-backdrop { display:none; position:fixed; inset:0; background:rgba(10,12,20,.45); z-index:55; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  #app .task-row[data-drag-row] { touch-action: pan-y; }
  #app .pt-dragging-card { box-shadow: 0 12px 28px rgba(0,0,0,.35); opacity:.98; }
  #app .pt-drop-placeholder { border:2px dashed var(--accent); border-radius:10px; background:var(--accent-soft); margin-bottom:6px; box-sizing:border-box; }
  body.pt-dragging-active { cursor: grabbing !important; }
  body.pt-dragging-active, body.pt-dragging-active * { -webkit-user-select:none !important; user-select:none !important; }
  #app .cal-link { color:var(--muted); display:inline-flex; align-items:center; padding:2px; flex-shrink:0; }
  #app .cal-link:hover { color:var(--accent); }
  @media (max-width:900px) {
    #app .pt-shell { flex-direction:column; }
    #app .pt-sidebar { width:100%; position:static; max-height:none; }
  }
  @media (max-width:640px) {
    #app .pt-shell { padding:10px; gap:0; border-radius:0; }
    #app .pt-main { padding:16px; border-radius:14px; }
    #app .mobile-nav-btn { display:flex; }
    #app .pt-sidebar {
      display:block; position:fixed; top:0; left:0; height:100vh; width:80%; max-width:280px;
      border-radius:0 16px 16px 0; z-index:60; transform:translateX(-100%);
      transition:transform .22s ease; box-shadow:0 0 0 rgba(0,0,0,0);
    }
    #app .pt-shell.nav-open .pt-sidebar { transform:translateX(0); box-shadow:8px 0 24px rgba(0,0,0,.25); }
    #app .pt-shell.nav-open .pt-backdrop { display:block; opacity:1; pointer-events:auto; }
    #app h1.pt-title { font-size:16px; }
    #app p.pt-subtitle { font-size:12px; margin:0 0 14px; }
    #app .cal-grid { gap:4px; }
    #app .cal-cell { min-height:50px; padding:5px; border-radius:8px; }
    #app .goal-row input[type="text"] { font-size:15px; }
    #app .pt-backlog-grid { grid-template-columns:1fr !important; }
    #app .task-row { flex-wrap:wrap; row-gap:6px; }
    #app .task-row .pt-task-text-input { flex:1 1 100% !important; min-width:0 !important; }
    #app .add-row { flex-wrap:wrap; }
    #app .add-row input[data-new-task-input] { flex:1 1 140px; min-width:0; }
    #app .pt-cluster-label { width:96px !important; }
    #app .pt-cluster-count { width:64px !important; font-size:11px !important; }
  }
</style>

<script>
(function(){

var STATUS_META = {
  none:   { label:'No data',  fg:'var(--none-fg)',   bg:'var(--none-bg)',   strong:'var(--none-strong)' },
  green:  { label:'On track', fg:'var(--green-fg)',  bg:'var(--green-bg)',  strong:'var(--green-strong)' },
  yellow: { label:'Partial',  fg:'var(--yellow-fg)', bg:'var(--yellow-bg)', strong:'var(--yellow-strong)' },
  red:    { label:'Blocked',  fg:'var(--red-fg)',    bg:'var(--red-bg)',    strong:'var(--red-strong)' }
};
var CYCLE = ['none','green','yellow','red'];
var CLUSTER_COLORS = ['#7F77DD','#1D9E75','#D85A30','#D4537E','#378ADD','#6366F1','#A97142','#64748B'];
var uiExpanded = { weekly:false, quarterSide:false, monthSide:false };
var confirmDelete = {};
var mobileNavOpen = false;

var TABS = [
  ['vision','Vision','target'],
  ['quarterly','Quarterly','layers'],
  ['monthly','Monthly','grid'],
  ['calendar','Calendar','calendar'],
  ['weekly','Weekly','checklist'],
  ['clusters','Clusters','sliders'],
  ['backlog','Backlog','archive']
];

var ICONS = {
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
  layers: '<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/>',
  checklist: '<path d="M4 6h2"/><path d="M4 12h2"/><path d="M4 18h2"/><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/>',
  archive: '<rect x="3" y="4" width="18" height="4" rx="1.5"/><path d="M5 8v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12.5h4"/>',
  sliders: '<line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2.2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="18" r="2.2"/>',
  chevronLeft: '<path d="M15 6l-6 6 6 6"/>',
  chevronRight: '<path d="M9 6l6 6-6 6"/>',
  starOutline: '<path d="M12 3l2.6 5.9 6.4.6-4.8 4.2 1.5 6.3L12 16.9 6.3 20l1.5-6.3-4.8-4.2 6.4-.6L12 3z"/>',
  starFill: '<path d="M12 3l2.6 5.9 6.4.6-4.8 4.2 1.5 6.3L12 16.9 6.3 20l1.5-6.3-4.8-4.2 6.4-.6L12 3z" fill="currentColor"/>',
  grip: '<circle cx="9" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.4" fill="currentColor" stroke="none"/>',
  menu: '<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>',
  close: '<line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/>'
};
function icon(name, size){
  size = size || 18;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
}

function emptyTaskMap(clusters){ var m = {}; clusters.forEach(function(c){ m[c.id] = []; }); return m; }
function emptyBridge(clusters){ var b = {}; clusters.forEach(function(c){ b[c.id] = {goals:[]}; }); return b; }

function defaultState(){
  var clusters = [
    {id:'design', name:'Design', color:CLUSTER_COLORS[0], subclusters:[]},
    {id:'social', name:'Social & facilitation', color:CLUSTER_COLORS[1], subclusters:[]},
    {id:'lang', name:'Languages', color:CLUSTER_COLORS[2], subclusters:[]},
    {id:'sport', name:'Sport', color:CLUSTER_COLORS[4], subclusters:[]},
    {id:'apt', name:'Apartment', color:CLUSTER_COLORS[6], subclusters:[]},
    {id:'job', name:'Job search & network', color:CLUSTER_COLORS[3], subclusters:[
      {id:'sub_apply', name:'Job applications'},
      {id:'sub_free', name:'Freelance projects'}
    ]}
  ];
  var now = new Date();
  return {
    visions: [
      {id:'v1', title:'Vision — Sep 2026', text:'Land a strategic / product design role at an agile B2B SaaS company, using the RepAIr case study to show research-to-shipped range. Freelance UX research and facilitation running alongside.'},
      {id:'v2', title:'Vision — Sep 2027', text:'Recognised as a strategic design voice in the repair and recommerce space — an established content practice, a DACH network, and either a high-leverage in-house seat or a thriving independent practice.'}
    ],
    clusters: clusters,
    quarters: [{id:'q1', label:'Q3 2026'}],
    quarterBridge: { q1: emptyBridge(clusters) },
    months: [{id:'m1', label:'August 2026', quarterId:'q1', weekIds:['w1','w2','w3','w4']}],
    weeks: {
      w1: {label:'Week 1', monthId:'m1', tasks: emptyTaskMap(clusters)},
      w2: {label:'Week 2', monthId:'m1', tasks: emptyTaskMap(clusters)},
      w3: {label:'Week 3', monthId:'m1', tasks: emptyTaskMap(clusters)},
      w4: {label:'Week 4', monthId:'m1', tasks: emptyTaskMap(clusters)}
    },
    backlog: { buy: [], ideas: [] },
    dayTasks: {},
    dayOrder: {},
    selected: { tab:'weekly', quarterId:'q1', monthId:'m1', weekId:'w1', calYear: now.getFullYear(), calMonth: now.getMonth(), calDay: null },
    seq: 1
  };
}

function normalizeState(s){
  if (!s || typeof s !== 'object') return defaultState();
  if (!Array.isArray(s.clusters) || !s.clusters.length) s.clusters = defaultState().clusters;
  s.clusters.forEach(function(c, i){
    if (!c.color) c.color = CLUSTER_COLORS[i % CLUSTER_COLORS.length];
    if (!Array.isArray(c.subclusters)) c.subclusters = [];
  });
  if (!Array.isArray(s.visions)) {
    var v = [];
    if (s.visions && typeof s.visions === 'object') {
      Object.keys(s.visions).forEach(function(k, idx){ v.push({ id: 'mig_v' + idx, title: 'Vision — ' + k, text: s.visions[k] || '' }); });
    }
    s.visions = v.length ? v : defaultState().visions;
  }
  if (!s.quarters || !s.quarters.length) s.quarters = defaultState().quarters;
  if (!s.quarterBridge) s.quarterBridge = {};
  s.quarters.forEach(function(q){
    if (!s.quarterBridge[q.id]) s.quarterBridge[q.id] = {};
    s.clusters.forEach(function(c){
      var existingGoals = (s.quarterBridge[q.id][c.id] && Array.isArray(s.quarterBridge[q.id][c.id].goals)) ? s.quarterBridge[q.id][c.id].goals : [];
      s.quarterBridge[q.id][c.id] = { goals: existingGoals };
    });
  });
  if (!s.months || !s.months.length) s.months = defaultState().months;
  if (!s.weeks) s.weeks = {};
  Object.keys(s.weeks).forEach(function(wid){
    if (typeof s.weeks[wid].autoCarried === 'undefined') s.weeks[wid].autoCarried = !(s.selected && s.selected.weekId === wid);
    if (!s.weeks[wid].tasks) s.weeks[wid].tasks = {};
    s.clusters.forEach(function(c){
      if (!Array.isArray(s.weeks[wid].tasks[c.id])) s.weeks[wid].tasks[c.id] = [];
      s.weeks[wid].tasks[c.id].forEach(function(t){
        if (typeof t.starred === 'undefined') t.starred = false;
        if (typeof t.date === 'undefined') t.date = '';
        if (typeof t.subclusterId === 'undefined') t.subclusterId = '';
        if (!t.target) t.target = 1;
        if (typeof t.progress === 'undefined') t.progress = 0;
      });
    });
  });
  if (!s.backlog) s.backlog = {buy:[], ideas:[]};
  if (!Array.isArray(s.backlog.buy)) s.backlog.buy = [];
  if (!Array.isArray(s.backlog.ideas)) s.backlog.ideas = [];
  s.backlog.buy.forEach(function(it){ if (typeof it.url === 'undefined') it.url = ''; });
  s.backlog.ideas.forEach(function(it){ if (typeof it.url === 'undefined') it.url = ''; });
  if (!s.dayTasks || typeof s.dayTasks !== 'object') s.dayTasks = {};
  Object.keys(s.dayTasks).forEach(function(dk){
    if (!Array.isArray(s.dayTasks[dk])) { s.dayTasks[dk] = []; return; }
    s.dayTasks[dk].forEach(function(t){
      if (typeof t.starred === 'undefined') t.starred = false;
      if (!t.target) t.target = 1;
      if (typeof t.progress === 'undefined') t.progress = 0;
    });
  });
  if (!s.dayOrder || typeof s.dayOrder !== 'object') s.dayOrder = {};
  if (!s.selected) s.selected = defaultState().selected;
  var now = new Date();
  if (typeof s.selected.calYear === 'undefined') s.selected.calYear = now.getFullYear();
  if (typeof s.selected.calMonth === 'undefined') s.selected.calMonth = now.getMonth();
  if (typeof s.selected.calDay === 'undefined') s.selected.calDay = null;
  if (!s.selected.tab) s.selected.tab = 'weekly';
  if (typeof s.seq === 'undefined') s.seq = 1;
  return s;
}

var state = null;
var saveTimer = null;
var app = document.getElementById('app');
var storageOk = true;
try { storageOk = !!(window && window.storage && typeof window.storage.get === 'function'); } catch(e){ storageOk = false; }

var SUPABASE_URL = 'https://tumgwafxtsdgjkkuojka.supabase.co';
var SUPABASE_KEY = 'sb_publishable_zZunbEMhq-D1aXxtb6SuJQ_BR9weJQc';
var supabaseStatus = 'checking';
// Only ever true once we've gotten a confirmed answer (good data, or a
// confirmed-empty row) straight from Supabase. A failed/errored load must
// NEVER flip this true — otherwise a transient network hiccup falls back to
// a blank template that then gets silently saved over real data.
var canSyncToSupabase = false;

function supaHeaders(extra){
  var h = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}
function supaLoad(){
  return fetch(SUPABASE_URL + '/rest/v1/planner_state?id=eq.default&select=data', { headers: supaHeaders() })
    .then(function(r){ if (!r.ok) throw new Error('bad status ' + r.status); return r.json(); })
    .then(function(rows){ return { ok:true, data: (rows && rows[0]) ? rows[0].data : null }; })
    .catch(function(e){ return { ok:false, data: undefined }; });
}
function supaSave(){
  if (!canSyncToSupabase) {
    // We never got a trustworthy read from Supabase this session (or the
    // read failed) — refuse to write. Writing here risks overwriting real
    // data with whatever fallback/blank state is currently in memory.
    supabaseStatus = 'blocked';
    render();
    return Promise.resolve();
  }
  return fetch(SUPABASE_URL + '/rest/v1/planner_state?on_conflict=id', {
    method: 'POST',
    headers: supaHeaders({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify([{ id:'default', data: state, updated_at: new Date().toISOString() }])
  }).then(function(r){ supabaseStatus = r.ok ? 'ok' : 'error'; render(); }).catch(function(){ supabaseStatus = 'error'; render(); });
}

function uid(){ state.seq += 1; return 't' + state.seq + '_' + Date.now().toString(36); }

var hasLocalEdits = false;
function scheduleSave(){
  hasLocalEdits = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    supaSave();
    if (storageOk) {
      try { window.storage.set('planner-state', JSON.stringify(state), false).catch(function(){ storageOk = false; }); }
      catch(e){ storageOk = false; }
    }
  }, 400);
}

function loadFromStorageFallback(){
  if (!storageOk) { state = defaultState(); render(); return; }
  try {
    window.storage.get('planner-state').then(function(res){
      try { state = res && res.value ? normalizeState(JSON.parse(res.value)) : defaultState(); }
      catch(e){ state = defaultState(); }
      render();
    }).catch(function(){ state = defaultState(); render(); });
  } catch(e){ state = defaultState(); render(); }
}

function init(){
  supaLoad().then(function(res){
    if (res.ok) {
      canSyncToSupabase = true;
      supabaseStatus = 'ok';
      if (res.data) { state = normalizeState(res.data); render(); return; }
      loadFromStorageFallback();
      return;
    }
    // Load failed: we have no idea what's really in Supabase, so syncing
    // stays disabled until a retry confirms it one way or the other.
    canSyncToSupabase = false;
    supabaseStatus = 'error';
    loadFromStorageFallback();
  });
}

function retrySync(){
  supabaseStatus = 'checking';
  render();
  supaLoad().then(function(res){
    if (!res.ok) { canSyncToSupabase = false; supabaseStatus = 'error'; render(); return; }
    if (res.data) {
      if (hasLocalEdits) {
        var keepLocal = window.confirm('Reconnected to Supabase. You have local changes made while disconnected.\n\nPress OK to KEEP your local changes and overwrite the cloud copy with them.\nPress Cancel to DISCARD your local changes and load the saved cloud copy instead.');
        canSyncToSupabase = true;
        if (keepLocal) { supabaseStatus = 'ok'; scheduleSave(); return; }
        hasLocalEdits = false; state = normalizeState(res.data); supabaseStatus = 'ok'; render(); return;
      }
      canSyncToSupabase = true;
      state = normalizeState(res.data); supabaseStatus = 'ok'; render(); return;
    }
    canSyncToSupabase = true;
    supabaseStatus = 'ok';
    if (hasLocalEdits) scheduleSave();
    render();
  });
}

function worst(list){
  if (list.indexOf('red') !== -1) return 'red';
  if (list.indexOf('yellow') !== -1) return 'yellow';
  if (list.indexOf('green') !== -1) return 'green';
  return 'none';
}
function effectiveStatus(t){
  if (t.target && t.target > 1) {
    if (!t.progress) return 'none';
    if (t.progress >= t.target) return 'green';
    return 'yellow';
  }
  return t.status;
}
function sortForDisplay(tasks){
  // Only completing a task (green) pushes it down. Everything else — including
  // starring — keeps its manual/drag order (Array.sort is stable, so ties
  // preserve current position instead of snapping back to a fixed order).
  return tasks.slice().sort(function(a, b){
    function score(t){ return effectiveStatus(t) === 'green' ? 1 : 0; }
    return score(a) - score(b);
  });
}

function clusterById(id){ return state.clusters.filter(function(c){ return c.id === id; })[0]; }
function monthForWeek(weekId){ return state.months.filter(function(m){ return m.weekIds.indexOf(weekId) !== -1; })[0]; }
function nextWeekId(weekId){
  var month = monthForWeek(weekId);
  if (!month) return null;
  var idx = month.weekIds.indexOf(weekId);
  if (idx !== -1 && idx < month.weekIds.length - 1) return month.weekIds[idx + 1];
  var mi = state.months.findIndex(function(m){ return m.id === month.id; });
  if (mi !== -1 && mi < state.months.length - 1) {
    var nextMonth = state.months[mi + 1];
    if (nextMonth.weekIds.length) return nextMonth.weekIds[0];
  }
  return null;
}

function prevWeekId(weekId){
  var month = monthForWeek(weekId);
  if (!month) return null;
  var idx = month.weekIds.indexOf(weekId);
  if (idx > 0) return month.weekIds[idx - 1];
  var mi = state.months.findIndex(function(m){ return m.id === month.id; });
  if (mi > 0) {
    var prevMonth = state.months[mi - 1];
    if (prevMonth.weekIds.length) return prevMonth.weekIds[prevMonth.weekIds.length - 1];
  }
  return null;
}
function copyTaskTo(t, destWeek, destCluster){
  state.weeks[destWeek].tasks[destCluster] = state.weeks[destWeek].tasks[destCluster] || [];
  state.weeks[destWeek].tasks[destCluster].push({ id: uid(), text:t.text, status:t.status, starred:false, date:'', subclusterId:t.subclusterId, target:t.target, progress:t.progress, carriedFrom: true });
}
function ensureAutoCarry(weekId){
  var week = state.weeks[weekId];
  if (!week || week.autoCarried) return false;
  week.autoCarried = true;
  var prev = prevWeekId(weekId);
  if (!prev || !state.weeks[prev]) return true;
  state.clusters.forEach(function(c){
    var prevTasks = state.weeks[prev].tasks[c.id] || [];
    prevTasks.forEach(function(t){
      if (effectiveStatus(t) === 'yellow' || effectiveStatus(t) === 'red') copyTaskTo(t, weekId, c.id);
    });
  });
  return true;
}

function weekClusterStatus(weekId, clusterId){
  var tasks = (state.weeks[weekId] && state.weeks[weekId].tasks[clusterId]) || [];
  if (!tasks.length) return 'none';
  return worst(tasks.map(effectiveStatus));
}
function monthClusterStatus(monthId, clusterId){
  var month = state.months.filter(function(m){ return m.id === monthId; })[0];
  if (!month) return 'none';
  return worst(month.weekIds.map(function(wid){ return weekClusterStatus(wid, clusterId); }));
}
function quarterClusterStatus(quarterId, clusterId){
  var months = state.months.filter(function(m){ return m.quarterId === quarterId; });
  return worst(months.map(function(m){ return monthClusterStatus(m.id, clusterId); }));
}
function overallClusterCounts(clusterId){
  var counts = {green:0, yellow:0, red:0, none:0};
  Object.keys(state.weeks).forEach(function(wid){
    (state.weeks[wid].tasks[clusterId] || []).forEach(function(t){ counts[effectiveStatus(t)] += 1; });
  });
  return counts;
}
function allTasksFlat(){
  var out = [];
  Object.keys(state.weeks).forEach(function(wid){
    var week = state.weeks[wid];
    state.clusters.forEach(function(c){
      (week.tasks[c.id] || []).forEach(function(t){ out.push({ task:t, weekId:wid, clusterId:c.id, clusterName:c.name }); });
    });
  });
  return out;
}

// ---- Day-specific tasks: standalone items pinned to one calendar date,
// not attached to any week/cluster. Shown merged with weekly tasks that
// happen to be scheduled (.date) for that same day, in Today and Calendar. ----
function dayTasksFor(dateKey){ return (state.dayTasks && state.dayTasks[dateKey]) || []; }
function findDayTask(dateKey, taskId){
  var arr = dayTasksFor(dateKey);
  for (var i = 0; i < arr.length; i++) if (arr[i].id === taskId) return arr[i];
  return null;
}
function dayItemKey(item){
  return item.kind === 'day' ? ('d:' + item.dateKey + ':' + item.task.id) : ('w:' + item.weekId + ':' + item.clusterId + ':' + item.task.id);
}
function dayItemsFor(dateKey){
  var items = [];
  allTasksFlat().forEach(function(x){ if (x.task.date === dateKey) items.push({ kind:'week', weekId:x.weekId, clusterId:x.clusterId, clusterName:x.clusterName, task:x.task }); });
  dayTasksFor(dateKey).forEach(function(t){ items.push({ kind:'day', dateKey:dateKey, task:t }); });
  var order = (state.dayOrder && state.dayOrder[dateKey]) || [];
  items.sort(function(a, b){
    var ia = order.indexOf(dayItemKey(a)), ib = order.indexOf(dayItemKey(b));
    if (ia === -1 && ib === -1) return 0;
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  return items;
}
function setDayOrder(dateKey, orderedKeys){
  if (!state.dayOrder) state.dayOrder = {};
  state.dayOrder[dateKey] = orderedKeys;
}
function itemRefFromEl(el){
  return { kind: el.dataset.itemKind, a: el.dataset.itemA, b: el.dataset.itemB, taskId: el.dataset.itemTask };
}
function findTaskByItemRef(ref){
  if (ref.kind === 'day') return findDayTask(ref.a, ref.taskId);
  return findTask(ref.a, ref.b, ref.taskId);
}
function deleteItemByRef(ref){
  if (ref.kind === 'day') { state.dayTasks[ref.a] = dayTasksFor(ref.a).filter(function(t){ return t.id !== ref.taskId; }); return; }
  var arr = (state.weeks[ref.a] && state.weeks[ref.a].tasks[ref.b]) || [];
  state.weeks[ref.a].tasks[ref.b] = arr.filter(function(t){ return t.id !== ref.taskId; });
}
function gcalLink(dateKey, text){
  var parts = dateKey.split('-').map(Number);
  var start = parts[0] + pad2(parts[1]) + pad2(parts[2]);
  var nextD = new Date(parts[0], parts[1] - 1, parts[2] + 1);
  var end = nextD.getFullYear() + pad2(nextD.getMonth() + 1) + pad2(nextD.getDate());
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(text) + '&dates=' + start + '/' + end;
}

function pill(status){
  var m = STATUS_META[status];
  return '<span class="pill" style="background:' + m.bg + '; color:' + m.fg + ';"><span class="dot" style="background:' + m.strong + ';"></span>' + m.label + '</span>';
}
function dotButton(status, attrs){
  var m = STATUS_META[status];
  return '<button ' + attrs + ' class="status-btn" style="width:26px;border:1.5px solid ' + m.strong + '; background:' + m.bg + ';" title="' + m.label + ', click to change"><span class="dot" style="width:11px;height:11px;background:' + m.strong + ';"></span></button>';
}
function taskControl(t, weekId, clusterId){
  if (t.target && t.target > 1) {
    var st = effectiveStatus(t), mm = STATUS_META[st];
    return '<button data-count-week="' + weekId + '" data-count-cluster="' + clusterId + '" data-count-task="' + t.id + '" class="status-btn" style="border:1.5px solid ' + mm.strong + '; background:' + mm.bg + '; color:' + mm.fg + '; font-size:11px; font-weight:700;" title="Click to log progress">' + t.progress + '/' + t.target + '</button>';
  }
  return dotButton(t.status, 'data-cycle-week="' + weekId + '" data-cycle-cluster="' + clusterId + '" data-cycle-task="' + t.id + '"');
}
function starButton(starred, attrs){
  return '<button ' + attrs + ' class="star-btn" style="color:' + (starred ? 'var(--star)' : 'var(--muted)') + ';" title="' + (starred ? 'Unstar' : 'Star as priority') + '">' + icon(starred ? 'starFill' : 'starOutline', 16) + '</button>';
}
function clusterDot(color){ return '<span class="dot" style="width:10px;height:10px;background:' + color + ';"></span>'; }

// Renders one row in the unified Today / Calendar-day list. `item` is either
// {kind:'week', weekId, clusterId, clusterName, task} — a weekly task that
// happens to be scheduled for this day — or {kind:'day', dateKey, task} — a
// standalone day-only task that isn't part of any week at all.
function renderDayItemRow(item){
  var t = item.task;
  var sm = STATUS_META[effectiveStatus(t)];
  var kind = item.kind;
  var a = kind === 'day' ? item.dateKey : item.weekId;
  var b = kind === 'day' ? '' : item.clusterId;
  var refAttrs = 'data-item-kind="' + kind + '" data-item-a="' + a + '" data-item-b="' + b + '" data-item-task="' + t.id + '"';
  var dragKey = dayItemKey(item);
  var dragAttrs = 'data-drag-row data-drag-key="' + escapeHtml(dragKey) + '" data-drag-kind="' + kind + '" data-drag-task="' + t.id + '" ' +
    (kind === 'day' ? ('data-drag-daykey="' + item.dateKey + '"') : ('data-drag-week="' + item.weekId + '" data-drag-cluster="' + item.clusterId + '" data-drag-sub=""'));
  var dateKey = kind === 'day' ? item.dateKey : t.date;

  var html = '<div class="task-row" ' + dragAttrs + ' style="padding:8px 10px; display:flex; gap:8px; align-items:center; background:' + sm.bg + ';' + (t.starred ? ' border-color:var(--star);' : '') + ' margin-bottom:6px;">';
  html += '<span class="drag-handle">' + icon('grip', 15) + '</span>';
  if (t.target && t.target > 1) {
    var mm = STATUS_META[effectiveStatus(t)];
    html += '<button data-item-count ' + refAttrs + ' class="status-btn" style="border:1.5px solid ' + mm.strong + '; background:' + mm.bg + '; color:' + mm.fg + '; font-size:11px; font-weight:700;" title="Click to log progress">' + t.progress + '/' + t.target + '</button>';
  } else {
    html += dotButton(t.status, 'data-item-cycle ' + refAttrs);
  }
  html += '<button data-item-star ' + refAttrs + ' class="star-btn" style="color:' + (t.starred ? 'var(--star)' : 'var(--muted)') + ';" title="' + (t.starred ? 'Unstar' : 'Star as priority') + '">' + icon(t.starred ? 'starFill' : 'starOutline', 16) + '</button>';
  html += '<input type="text" class="pt-task-text-input" data-item-field="text" ' + refAttrs + ' value="' + escapeHtml(t.text) + '" placeholder="Task..." style="flex:1; min-width:0; border:none; background:transparent; font-size:13px; font-weight:600; color:var(--fg); padding:2px 0;">';
  if (kind === 'week') {
    var cl = clusterById(item.clusterId);
    html += '<span style="font-size:11px; color:' + (cl ? cl.color : 'var(--muted)') + '; font-weight:600; white-space:nowrap;">' + escapeHtml(item.clusterName) + '</span>';
  } else {
    html += '<span style="font-size:11px; color:var(--muted); font-weight:600; white-space:nowrap;">Day only</span>';
  }
  if (dateKey) html += '<a href="' + gcalLink(dateKey, t.text) + '" target="_blank" rel="noopener noreferrer" class="cal-link" title="Add to Google Calendar">' + icon('calendar', 15) + '</a>';
  if (kind === 'week') {
    html += '<button data-item-unschedule ' + refAttrs + ' title="Remove from today" style="border:none; background:transparent; color:var(--muted); font-size:16px; padding:2px 6px;">×</button>';
  } else {
    html += '<button data-item-del ' + refAttrs + ' title="Delete" style="border:none; background:transparent; color:var(--muted); font-size:16px; padding:2px 6px;">×</button>';
  }
  html += '</div>';
  return html;
}

function syncStatusLine(){
  if (supabaseStatus === 'ok') return '<div style="font-size:11px; padding:2px 10px 8px; color:var(--green-fg);">● Synced to Supabase</div>';
  if (supabaseStatus === 'checking') return '<div style="font-size:11px; padding:2px 10px 8px; color:var(--muted);">● Checking Supabase…</div>';
  var msg = supabaseStatus === 'blocked'
    ? '● Not connected — changes are NOT being saved'
    : '● Supabase unreachable — changes are NOT being saved';
  return '<div style="font-size:11px; padding:2px 10px 4px; color:var(--red-fg); font-weight:600;">' + msg + '</div>' +
    '<button data-retry-sync style="width:100%; text-align:left; border:1px solid var(--red-strong); background:transparent; color:var(--red-fg); font-size:12px; padding:6px 10px; border-radius:8px; margin-bottom:8px;">Retry connection</button>';
}
function syncWarningBanner(){
  if (canSyncToSupabase) return '';
  return '<div class="card" style="border:1.5px solid var(--red-strong); background:var(--red-bg); color:var(--red-fg); padding:12px 14px; margin-bottom:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">' +
    '<div style="flex:1; min-width:180px; font-size:13px; font-weight:600;">⚠ Not connected to your saved data. Anything you do now stays only in this tab and will be lost if you reload or close it.</div>' +
    '<button data-retry-sync style="border:1px solid var(--red-strong); background:transparent; color:var(--red-fg); font-size:12px; font-weight:700; padding:6px 12px; border-radius:8px; white-space:nowrap;">Retry connection</button>' +
    '</div>';
}
function sidebar(){

  html += '<div class="brand"><span class="brand-mark"></span>Planning<button data-mobile-nav-close class="mobile-nav-btn" style="margin-left:auto;" title="Close menu">' + icon('close', 16) + '</button></div>';
  TABS.forEach(function(t){
    var active = state.selected.tab === t[0];
    html += '<button data-tab="' + t[0] + '" class="navrow' + (active ? ' active' : '') + '">' + icon(t[2], 17) + '<span>' + t[1] + '</span></button>';
  });
  html += sidebarList(state.quarters, state.selected.quarterId, 'data-goto-quarter', 'Quarter', 'quarterSide', {placeholder:'+ Add quarter', action:'quarter'});
  html += sidebarList(state.months, state.selected.monthId, 'data-goto-month', 'Month', 'monthSide', {placeholder:'+ Add month', action:'month'});
  html += '<div class="side-label">Backup</div>';
  html += syncStatusLine();
  html += '<button data-export style="width:100%; text-align:left; border:1px solid var(--border); background:transparent; color:var(--chip-fg); font-size:12px; padding:7px 10px; border-radius:8px; margin-bottom:6px;">Download backup (.json)</button>';
  html += '<label style="display:block; width:100%; text-align:left; border:1px solid var(--border); background:transparent; color:var(--chip-fg); font-size:12px; padding:7px 10px; border-radius:8px; cursor:pointer;">Restore from file<input type="file" accept="application/json" data-import-file style="display:none;"></label>';
  html += '<div style="font-size:10px; color:var(--muted); padding:6px 10px 0;">Save a backup regularly — this is the copy that survives publishing or switching devices.</div>';
  html += '</div>';
  return html;
}
function sidebarList(items, selectedId, gotoAttr, label, expandKey, addAction){
  var selectedItem = items.filter(function(i){ return i.id === selectedId; })[0];
  var rest = items.filter(function(i){ return i.id !== selectedId; }).slice().reverse();
  var ordered = selectedItem ? [selectedItem].concat(rest) : rest;
  var expanded = uiExpanded[expandKey];
  var visible = expanded ? ordered : ordered.slice(0, 4);
  var hiddenCount = ordered.length - visible.length;
  var html = '<div class="side-label">' + label + '</div>';
  visible.forEach(function(it){
    var active = it.id === selectedId;
    html += '<button ' + gotoAttr + '="' + it.id + '" class="side-chip' + (active ? ' active' : '') + '">' + it.label + '</button>';
  });
  if (hiddenCount > 0 || expanded) html += '<button data-toggle-expand="' + expandKey + '" class="side-chip" style="opacity:.65;">' + (expanded ? 'Show less' : ('+' + hiddenCount + ' earlier')) + '</button>';
  html += '<input type="text" placeholder="' + addAction.placeholder + '" data-new-label data-add="' + addAction.action + '" style="width:100%; border:1px dashed var(--border); background:transparent; border-radius:8px; padding:6px 10px; font-size:12px; margin-top:4px;">';
  return html;
}
function chipRow(items, selectedId, dataAttr, addAction, expandKey){
  var selectedItem = items.filter(function(i){ return i.id === selectedId; })[0];
  var rest = items.filter(function(i){ return i.id !== selectedId; }).slice().reverse();
  var ordered = selectedItem ? [selectedItem].concat(rest) : rest;
  var expanded = uiExpanded[expandKey];
  var visible = expanded ? ordered : ordered.slice(0, 4);
  var hiddenCount = ordered.length - visible.length;
  var html = '<div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:18px;">';
  visible.forEach(function(it){
    var active = it.id === selectedId;
    html += '<button ' + dataAttr + '="' + it.id + '" class="chip' + (active ? ' active' : '') + '">' + it.label + '</button>';
  });
  if (hiddenCount > 0 || expanded) html += '<button data-toggle-expand="' + expandKey + '" class="chip" style="opacity:.7;">' + (expanded ? 'Show less' : ('+' + hiddenCount + ' earlier')) + '</button>';
  html += '<input type="text" placeholder="' + addAction.placeholder + '" data-new-label data-add="' + addAction.action + '" style="border:1px dashed var(--border); background:transparent; border-radius:20px; padding:6px 12px; font-size:13px; width:150px;">';
  html += '</div>';
  return html;
}

function renderVision(){

    html += '</div>';
  });
  html += '</div>';
  html += '<div style="font-size:12px; color:var(--muted); margin-top:10px;">Click a row to open its quarterly goals.</div>';

function renderQuarterly(){
  var q = state.quarters.filter(function(x){ return x.id === state.selected.quarterId; })[0] || state.quarters[0];
  var html = '';
  state.clusters.forEach(function(c){
    var goals = (state.quarterBridge[q.id][c.id] && state.quarterBridge[q.id][c.id].goals) || [];
    var status = quarterClusterStatus(q.id, c.id);
    html += '<div class="card" style="margin-bottom:16px; overflow:hidden; border-left:4px solid ' + c.color + ';">';
    html += '<div style="display:flex; align-items:center; justify-content:space-between; padding:13px 16px;" class="hairline">';
    html += '<div style="font-size:13px; font-weight:700;">' + escapeHtml(c.name) + '</div>' + pill(status) + '</div>';
    html += '<div style="padding:6px 16px;">';
    if (!goals.length) html += '<div style="font-size:12px; color:var(--muted); padding:10px 0;">No goals yet for this quarter.</div>';
    goals.forEach(function(g, i){
      html += '<div class="goal-row"' + (i < goals.length - 1 ? ' style="border-bottom:1px solid var(--border-soft);"' : '') + '>';
      html += '<span style="width:9px;height:9px;border-radius:50%;background:' + c.color + '; flex-shrink:0;"></span>';
      html += '<input type="text" data-field="goal-title" data-quarter="' + q.id + '" data-cluster="' + c.id + '" data-goal="' + g.id + '" value="' + escapeHtml(g.title) + '" placeholder="Goal..." style="flex:1; border:none; background:transparent; font-size:17px; font-weight:700; padding:4px 0;">';
      html += '<button data-del-goal data-quarter="' + q.id + '" data-cluster="' + c.id + '" data-goal="' + g.id + '" style="border:none; background:transparent; color:var(--muted); font-size:16px; padding:2px 6px;">×</button>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div style="padding:8px 16px 16px;">';
    html += '<input type="text" data-new-goal-input data-quarter="' + q.id + '" data-cluster="' + c.id + '" placeholder="+ Add a goal for this quarter and press Enter..." style="width:100%; border:1px dashed var(--border); border-radius:8px; padding:8px 10px; font-size:12px; background:transparent;">';
    html += '</div></div>';
  });
  html += '<div style="font-size:12px; color:var(--muted); margin-top:6px;">Pick a quarter from the sidebar.</div>';
  return html;
}

function renderMonthly(){
  var m = state.months.filter(function(x){ return x.id === state.selected.monthId; })[0] || state.months[0];
  var colW = 96;
  var html = '<div class="card" style="overflow-x:auto;">';

  html += '<div>Cluster</div>';
  m.weekIds.forEach(function(wid){ html += '<div style="text-align:center;">' + (state.weeks[wid] ? state.weeks[wid].label : wid) + '</div>'; });
  html += '<div style="text-align:right;">Month</div></div>';
  state.clusters.forEach(function(c, i){
    html += '<div style="display:grid; grid-template-columns: 190px repeat(' + m.weekIds.length + ', ' + colW + 'px) 100px; padding:10px 16px; align-items:center; min-width:' + (190 + m.weekIds.length*colW + 100) + 'px;' + (i < state.clusters.length - 1 ? ' border-bottom:1px solid var(--border-soft);' : '') + '">';
    html += '<div style="font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px;">' + clusterDot(c.color) + escapeHtml(c.name) + '</div>';

      var status = weekClusterStatus(wid, c.id);
      html += '<div style="display:flex; justify-content:center;">' + dotButton(status, 'data-goto-week="' + wid + '"') + '</div>';
    });

  });
  html += '</div>';
  html += '<div style="font-size:12px; color:var(--muted); margin-top:10px;">Click any week\'s dot to open and edit that week. Pick a month from the sidebar.</div>';

function renderTaskRow(t, weekId, clusterId, subId){
  var m = STATUS_META[effectiveStatus(t)];
  var es = effectiveStatus(t);
  var dragKey = 'w:' + weekId + ':' + clusterId + ':' + t.id;
  var html = '<div class="task-row" data-drag-row data-drag-key="' + escapeHtml(dragKey) + '" data-drag-kind="week" data-drag-task="' + t.id + '" data-drag-week="' + weekId + '" data-drag-cluster="' + clusterId + '" data-drag-sub="' + (subId||'') + '" style="padding:9px 10px; display:flex; gap:8px; align-items:center; background:' + m.bg + ';' + (t.starred ? ' border-color:var(--star);' : '') + ' margin-bottom:6px;">';
  html += '<span class="drag-handle">' + icon('grip', 15) + '</span>';
  html += taskControl(t, weekId, clusterId);
  html += starButton(!!t.starred, 'data-star-week="' + weekId + '" data-star-cluster="' + clusterId + '" data-star-task="' + t.id + '"');
  html += '<input type="text" class="pt-task-text-input" data-field="task-text" data-week="' + weekId + '" data-cluster="' + clusterId + '" data-task="' + t.id + '" value="' + escapeHtml(t.text) + '" placeholder="Task..." style="flex:1; min-width:0; border:none; background:transparent; font-size:13px; font-weight:600; color:var(--fg); padding:2px 0;">';
  if (t.carriedFrom) html += '<span title="Copied here from a previous week" style="font-size:10px; color:' + m.fg + '; opacity:.7; white-space:nowrap;">carried</span>';
  var isToday = t.date === todayStr();
  html += '<button data-toggle-today data-week="' + weekId + '" data-cluster="' + clusterId + '" data-task="' + t.id + '" title="' + (isToday ? 'Scheduled for today — click to remove' : 'Push to today') + '" style="border:1px solid ' + (isToday ? 'var(--accent)' : m.fg + '55') + '; background:' + (isToday ? 'var(--accent-soft)' : 'transparent') + '; color:' + (isToday ? 'var(--accent)' : m.fg) + '; font-size:11px; font-weight:700; padding:3px 7px; border-radius:6px; white-space:nowrap;">' + (isToday ? 'Today ✓' : '→ Today') + '</button>';
  if (es === 'yellow' || es === 'red') {
    html += '<button data-move-next data-week="' + weekId + '" data-cluster="' + clusterId + '" data-task="' + t.id + '" title="Copy to next week, keep this one here too" style="border:none; background:transparent; color:' + m.fg + '; opacity:.8; font-size:11px; font-weight:700; padding:2px 6px; white-space:nowrap;">→ copy next wk</button>';
  }
  html += '<button data-del-task data-week="' + weekId + '" data-cluster="' + clusterId + '" data-task="' + t.id + '" style="border:none; background:transparent; color:var(--muted); font-size:16px; line-height:1; padding:2px 6px;">×</button>';
  html += '</div>';
  return html;
}
function addRow(weekId, clusterId, subId){
  var html = '<div class="add-row" data-add-week="' + weekId + '" data-add-cluster="' + clusterId + '" data-add-sub="' + (subId||'') + '">';
  html += '<input type="number" min="1" data-new-task-target placeholder="×1" title="Set >1 to track as a count, e.g. practice 2x this week" style="width:52px; border:1px dashed var(--border); border-radius:8px; padding:8px 4px; font-size:12px; background:transparent; text-align:center;">';
  html += '<input type="text" data-new-task-input data-week="' + weekId + '" data-cluster="' + clusterId + '" data-sub="' + (subId||'') + '" placeholder="Add task and press Enter..." style="flex:1; border:1px dashed var(--border); border-radius:8px; padding:8px 10px; font-size:12px; background:transparent;">';

function groupDropAttrs(weekId, clusterId, subId){
  return 'data-dropzone="group" data-drop-week="' + weekId + '" data-drop-cluster="' + clusterId + '" data-drop-sub="' + (subId||'') + '"';
}
function taskDropAttrs(weekId, clusterId, subId, taskId){
  return 'data-dropzone="task" data-drop-week="' + weekId + '" data-drop-cluster="' + clusterId + '" data-drop-sub="' + (subId||'') + '" data-drop-before="' + taskId + '"';

function weekChipRow(items, selectedId){
  var html = '<div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:18px;">';
  items.forEach(function(it){
    var active = it.id === selectedId;
    html += '<button data-goto-week="' + it.id + '" class="chip' + (active ? ' active' : '') + '">' + it.label + '</button>';
  });
  html += '<input type="text" placeholder="+ Add week" data-new-label data-add="week" style="border:1px dashed var(--border); background:transparent; border-radius:20px; padding:6px 12px; font-size:13px; width:150px;">';
  html += '</div>';
  return html;
}

function renderWeekly(){
  var month = state.months.filter(function(m){ return m.id === state.selected.monthId; })[0] || state.months[0];
  var weeksInMonth = month.weekIds.map(function(wid){ return {id:wid, label: state.weeks[wid] ? state.weeks[wid].label : wid}; });
  var wk = weeksInMonth.filter(function(w){ return w.id === state.selected.weekId; })[0] || weeksInMonth[0];
  if (wk && wk.id !== state.selected.weekId) state.selected.weekId = wk.id;
  if (wk && ensureAutoCarry(wk.id)) scheduleSave();
  var html = '<div style="font-size:12px; color:var(--muted); margin-bottom:8px;">' + escapeHtml(month.label) + '</div>';
  html += weekChipRow(weeksInMonth, wk ? wk.id : null);

  var todayKey = todayStr();
  var todayItems = dayItemsFor(todayKey);
  var n = new Date();
  html += '<div class="card" data-dropzone="daylist" data-drop-date="' + todayKey + '" style="padding:14px 16px; margin-bottom:18px; border:2px dashed var(--accent-soft);">';
  html += '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;"><div style="font-size:13px; font-weight:700;">Today — ' + MONTH_NAMES[n.getMonth()] + ' ' + n.getDate() + '</div><div style="font-size:11px; color:var(--muted);">Drag a card here to schedule it, or reorder</div></div>';
  if (!todayItems.length) html += '<div style="font-size:12px; color:var(--muted); padding:6px 2px 2px;">Nothing scheduled for today yet.</div>';
  todayItems.forEach(function(item){ html += renderDayItemRow(item); });
  html += '<input type="text" data-new-daytask-input data-daykey="' + todayKey + '" placeholder="+ Add a task just for today (not part of any week) and press Enter..." style="width:100%; border:1px dashed var(--border); border-radius:8px; padding:8px 10px; font-size:12px; background:transparent; margin-top:2px;">';
  html += '</div>';

  var week = state.weeks[wk.id];
  if (!week) { return html + '<div style="color:var(--muted); font-size:13px;">No weeks yet — add one above.</div>'; }

  state.clusters.forEach(function(c){
    var tasks = week.tasks[c.id] || [];
    var status = weekClusterStatus(wk.id, c.id);
    html += '<div class="card" style="margin-bottom:14px; overflow:hidden; border-left:4px solid ' + c.color + ';">';
    html += '<div style="display:flex; align-items:center; justify-content:space-between; padding:13px 16px;" class="hairline">';
    html += '<div style="font-size:13px; font-weight:700;">' + escapeHtml(c.name) + '</div>' + pill(status) + '</div>';
    html += '<div style="padding:10px;">';

    if (c.subclusters.length) {
      var general = sortForDisplay(tasks.filter(function(t){ return !t.subclusterId; }));
      html += '<div ' + groupDropAttrs(wk.id, c.id, '') + '>';
      html += '<div class="subgroup-head">General</div>';
      general.forEach(function(t){ html += renderTaskRow(t, wk.id, c.id, ''); });
      html += addRow(wk.id, c.id, '');
      html += '</div>';
      c.subclusters.forEach(function(sc){
        var subTasks = sortForDisplay(tasks.filter(function(t){ return t.subclusterId === sc.id; }));
        var subStatus = subTasks.length ? worst(subTasks.map(effectiveStatus)) : 'none';
        html += '<div ' + groupDropAttrs(wk.id, c.id, sc.id) + '>';
        html += '<div class="subgroup-head">' + escapeHtml(sc.name) + ' ' + pill(subStatus) + '</div>';
        subTasks.forEach(function(t){ html += renderTaskRow(t, wk.id, c.id, sc.id); });
        html += addRow(wk.id, c.id, sc.id);
        html += '</div>';
      });
    } else {
      html += '<div ' + groupDropAttrs(wk.id, c.id, '') + '>';
      sortForDisplay(tasks).forEach(function(t){ html += renderTaskRow(t, wk.id, c.id, ''); });
      html += addRow(wk.id, c.id, '');
      html += '</div>';
    }
    html += '</div></div>';
  });
  return html;
}

  return html;
}

var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var DAY_NAMES = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function dateStr(y,m,d){ return y + '-' + pad2(m+1) + '-' + pad2(d); }
function todayStr(){ var n = new Date(); return dateStr(n.getFullYear(), n.getMonth(), n.getDate()); }

function renderCalendar(){
  var y = state.selected.calYear, m = state.selected.calMonth;
  var first = new Date(y, m, 1);
  var startOffset = (first.getDay() + 6) % 7;
  var gridStart = new Date(y, m, 1 - startOffset);
  var todaysDate = todayStr();
  var flat = allTasksFlat();

  var html = '<div style="display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:18px;">';
  html += '<button data-cal-prev class="cal-nav-btn">' + icon('chevronLeft', 16) + '</button>';
  html += '<div style="font-size:15px; font-weight:700; min-width:160px; text-align:center;">' + MONTH_NAMES[m] + ' ' + y + '</div>';
  html += '<button data-cal-next class="cal-nav-btn">' + icon('chevronRight', 16) + '</button>';
  html += '</div>';
  html += '<div class="cal-grid" style="margin-bottom:6px;">';
  DAY_NAMES.forEach(function(d){ html += '<div class="cal-head">' + d + '</div>'; });
  html += '</div>';
  html += '<div class="cal-grid">';
  for (var i = 0; i < 42; i++) {
    var d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    var ds = dateStr(d.getFullYear(), d.getMonth(), d.getDate());
    var inMonth = d.getMonth() === m;
    var dayTaskCount = flat.filter(function(x){ return x.task.date === ds; }).length + dayTasksFor(ds).length;
    var cls = 'cal-cell' + (dayTaskCount > 0 ? ' has-tasks' : '') + (ds === todaysDate ? ' today' : '') + (!inMonth ? ' out' : '');
    html += '<button data-cal-day="' + ds + '" class="' + cls + '" style="text-align:left;">';
    html += '<div style="font-size:13px; font-weight:700;">' + pad2(d.getDate()) + '</div>';
    html += '<div style="font-size:11px; color:' + (dayTaskCount > 0 ? 'var(--accent)' : 'var(--muted)') + '; font-weight:600; margin-top:4px;">' + dayTaskCount + (dayTaskCount === 1 ? ' task' : ' tasks') + '</div>';
    html += '</button>';
  }
  html += '</div>';

  var selDay = state.selected.calDay;
  if (selDay) {
    var dayItems2 = dayItemsFor(selDay);
    html += '<div class="card" style="margin-top:20px; overflow:hidden;">';
    html += '<div style="padding:13px 16px; font-size:13px; font-weight:700;" class="hairline">' + selDay + '</div>';
    html += '<div data-dropzone="daylist" data-drop-date="' + selDay + '" style="padding:10px;">';
    if (!dayItems2.length) html += '<div style="font-size:12px; color:var(--muted); padding:6px 6px 12px;">Nothing scheduled yet.</div>';
    dayItems2.forEach(function(item){ html += renderDayItemRow(item); });
    html += '<input type="text" data-new-daytask-input data-daykey="' + selDay + '" placeholder="+ Add a day-only task (not part of any week) and press Enter..." style="width:100%; border:1px dashed var(--border); border-radius:8px; padding:8px 10px; font-size:12px; background:transparent; margin-top:2px;">';
    html += '<div style="display:flex; gap:8px; margin-top:8px;">';
    html += '<select data-cal-cluster style="border:1px solid var(--border); border-radius:8px; padding:7px 8px; font-size:12px; background:transparent;">';
    state.clusters.forEach(function(c){ html += '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>'; });
    html += '</select>';
    html += '<input type="text" data-cal-new-task placeholder="...or add into a week/cluster and press Enter" style="flex:1; border:1px dashed var(--border); border-radius:8px; padding:8px 10px; font-size:12px; background:transparent;">';
    html += '</div>';
    html += '<div style="font-size:11px; color:var(--muted); margin-top:8px;">Tasks added into a week/cluster file under your currently selected week (' + (state.weeks[state.selected.weekId] ? state.weeks[state.selected.weekId].label : '') + ').</div>';
    html += '</div></div>';
  }
  return html;
}

function escapeHtml(s){ return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render(){
  var body = '';
  if (state.selected.tab === 'vision') body = renderVision();
  else if (state.selected.tab === 'quarterly') body = renderQuarterly();
  else if (state.selected.tab === 'monthly') body = renderMonthly();
  else if (state.selected.tab === 'calendar') body = renderCalendar();
  else if (state.selected.tab === 'weekly') body = renderWeekly();
  else if (state.selected.tab === 'clusters') body = renderClusters();
  else body = renderBacklog();
  var titleMap = {vision:'Vision', quarterly:'Quarterly goals', monthly:'Monthly overview', calendar:'Calendar', weekly:'Weekly tracker', clusters:'Clusters', backlog:'Backlog'};
  var topbar = '<div class="pt-topbar"><button data-mobile-nav-toggle class="mobile-nav-btn" title="Open menu">' + icon('menu', 18) + '</button><div><h1 class="pt-title">' + titleMap[state.selected.tab] + '</h1><p class="pt-subtitle">Update a week and it rolls up through months and quarters automatically.</p></div></div>';
  var main = '<div class="pt-main">' + topbar + syncWarningBanner() + body + '</div>';
  var shellClass = 'pt-shell' + (mobileNavOpen ? ' nav-open' : '');
  app.innerHTML = '<div class="' + shellClass + '">' + sidebar() + main + '<div class="pt-backdrop" data-mobile-nav-backdrop></div></div>';
}

function findTask(weekId, clusterId, taskId){
  var arr = state.weeks[weekId].tasks[clusterId];
  for (var i=0;i<arr.length;i++) if (arr[i].id === taskId) return arr[i];
  return null;
}
function clearSubclusterRefs(clusterId, subId){
  Object.keys(state.weeks).forEach(function(wid){ (state.weeks[wid].tasks[clusterId] || []).forEach(function(t){ if (t.subclusterId === subId) t.subclusterId = ''; }); });
}
function moveTask(payload, destWeek, destCluster, destSub, beforeTaskId){
  if (!payload) return;
  var srcArr = state.weeks[payload.week] && state.weeks[payload.week].tasks[payload.cluster];
  if (!srcArr) return;
  var idx = srcArr.findIndex(function(t){ return t.id === payload.task; });
  if (idx === -1) return;
  var taskObj = srcArr[idx];
  if (beforeTaskId === taskObj.id) return;
  srcArr.splice(idx, 1);
  taskObj.subclusterId = destSub || '';
  var destArr = state.weeks[destWeek].tasks[destCluster];
  if (beforeTaskId) {
    var ti = destArr.findIndex(function(t){ return t.id === beforeTaskId; });
    if (ti === -1) destArr.push(taskObj); else destArr.splice(ti, 0, taskObj);
  } else {
    destArr.push(taskObj);
  }
}

// ---- Pointer-based drag & drop (mouse + touch + pen, uniformly) ----
// Replaces the old native HTML5 drag-and-drop, which on touch devices only
// worked when the finger landed precisely on the tiny grip icon and gave no
// live feedback. This lets a drag start from anywhere on the card (except
// its buttons/input, which still work normally), tracks the card under the
// finger/pointer directly, and smoothly slides the other rows out of the way
// (a FLIP animation) as you cross over them.
var ptr = null;
function isFormControl(el){ return !!el.closest('input, textarea, select, a, button'); }
function rowPayloadFromEl(rowEl){
  if (rowEl.dataset.dragKind === 'day') return { kind:'day', dateKey: rowEl.dataset.dragDaykey, task: rowEl.dataset.dragTask };
  return { kind:'week', week: rowEl.dataset.dragWeek, cluster: rowEl.dataset.dragCluster, sub: rowEl.dataset.dragSub || '', task: rowEl.dataset.dragTask };
}

app.addEventListener('pointerdown', function(e){
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  var row = e.target.closest('[data-drag-row]');
  if (!row) return;
  if (isFormControl(e.target)) return;
  ptr = { row: row, pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, payload: rowPayloadFromEl(row), active: false, isTouch: e.pointerType === 'touch' };
  if (ptr.isTouch) {
    // Touch needs a brief hold before it commits to a drag, so a normal
    // scroll swipe (which also starts as vertical movement) isn't hijacked.
    ptr.pressTimer = setTimeout(function(){
      if (ptr && !ptr.active) { var ev = ptr.lastEvent || e; startDrag(ev); updateDrag(ev); }
    }, 160);
  }
});
app.addEventListener('pointermove', function(e){
  if (!ptr) return;
  ptr.lastEvent = e;
  if (!ptr.active) {
    var dx = e.clientX - ptr.startX, dy = e.clientY - ptr.startY;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (ptr.isTouch) {
      if (dist > 10) { clearTimeout(ptr.pressTimer); ptr = null; } // moved -> treat as a scroll, let it through
      return;
    }
    if (dist > 6) { startDrag(e); updateDrag(e); }
    return;
  }
  updateDrag(e);
});
app.addEventListener('pointerup', endDrag);
app.addEventListener('pointercancel', endDrag);

function startDrag(e){
  if (!ptr) return;
  clearTimeout(ptr.pressTimer);
  ptr.active = true;
  var rect = ptr.row.getBoundingClientRect();
  ptr.grabDX = ptr.startX - rect.left;
  ptr.grabDY = ptr.startY - rect.top;
  ptr.placeholder = document.createElement('div');
  ptr.placeholder.className = 'pt-drop-placeholder';
  ptr.placeholder.style.height = rect.height + 'px';
  ptr.row.parentNode.insertBefore(ptr.placeholder, ptr.row);
  ptr.row.classList.add('pt-dragging-card');
  ptr.row.style.position = 'fixed';
  ptr.row.style.width = rect.width + 'px';
  ptr.row.style.left = rect.left + 'px';
  ptr.row.style.top = rect.top + 'px';
  ptr.row.style.zIndex = 9999;
  ptr.row.style.pointerEvents = 'none';
  ptr.row.style.margin = '0';
  document.body.classList.add('pt-dragging-active');
  try { ptr.row.setPointerCapture(ptr.pointerId); } catch(err){}
  e.preventDefault();
}

function movePlaceholder(container, beforeNode){
  if (ptr.placeholder.parentNode === container && ptr.placeholder.nextSibling === beforeNode) return;
  var rows = Array.prototype.filter.call(container.children, function(el){ return el !== ptr.placeholder && el !== ptr.row && el.matches('[data-drag-row]'); });
  var firstRects = rows.map(function(el){ return el.getBoundingClientRect(); });
  container.insertBefore(ptr.placeholder, beforeNode);
  rows.forEach(function(el, i){
    var last = el.getBoundingClientRect();
    var dx = firstRects[i].left - last.left, dy = firstRects[i].top - last.top;
    if (dx || dy) {
      el.style.transition = 'none';
      el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      requestAnimationFrame(function(){
        el.style.transition = 'transform .18s ease';
        el.style.transform = '';
      });
    }
  });
}

function updateDrag(e){
  e.preventDefault();
  ptr.row.style.left = (e.clientX - ptr.grabDX) + 'px';
  ptr.row.style.top = (e.clientY - ptr.grabDY) + 'px';
  var overEl = document.elementFromPoint(e.clientX, e.clientY);
  if (!overEl) return;
  var container = overEl.closest('[data-dropzone]');
  if (!container) return;
  var siblingRow = overEl.closest('[data-drag-row]');
  if (siblingRow === ptr.row) return;
  if (siblingRow && container.contains(siblingRow)) {
    var r = siblingRow.getBoundingClientRect();
    var before = (e.clientY - r.top) < r.height / 2;
    movePlaceholder(container, before ? siblingRow : siblingRow.nextSibling);
  } else {
    var anchorEl = container.querySelector('.add-row, [data-new-daytask-input]');
    movePlaceholder(container, anchorEl || null);
  }
}

function reorderDayList(dateKey, payload, beforeEl){
  var items = dayItemsFor(dateKey);
  var movedKey = payload.kind === 'day' ? ('d:' + payload.dateKey + ':' + payload.task) : ('w:' + payload.week + ':' + payload.cluster + ':' + payload.task);
  var keys = items.map(dayItemKey).filter(function(k){ return k !== movedKey; });
  var beforeKey = beforeEl ? beforeEl.dataset.dragKey : null;
  var insertAt = beforeKey ? keys.indexOf(beforeKey) : -1;
  if (insertAt === -1) keys.push(movedKey); else keys.splice(insertAt, 0, movedKey);
  setDayOrder(dateKey, keys);
}

function handleDrop(payload, container, beforeEl){
  var dz = container.dataset.dropzone;
  if (dz === 'group') {
    if (payload.kind !== 'week') return; // day-only tasks don't belong in a weekly cluster list
    moveTask(payload, container.dataset.dropWeek, container.dataset.dropCluster, container.dataset.dropSub, beforeEl ? beforeEl.dataset.dragTask : null);
  } else if (dz === 'daylist') {
    var dateKey = container.dataset.dropDate;
    if (payload.kind === 'week') {
      var task = findTask(payload.week, payload.cluster, payload.task);
      if (task) task.date = dateKey;
    }
    reorderDayList(dateKey, payload, beforeEl);
  }
}

function endDrag(e){
  if (!ptr) return;
  clearTimeout(ptr.pressTimer);
  if (!ptr.active) { ptr = null; return; }
  document.body.classList.remove('pt-dragging-active');
  var container = ptr.placeholder.parentNode;
  var beforeEl = ptr.placeholder.nextElementSibling;
  container.removeChild(ptr.placeholder);
  handleDrop(ptr.payload, container, beforeEl);
  ptr = null;
  render(); scheduleSave();
}

function exportBackup(){
  try {
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'planning-tracker-backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  } catch(e){ console.warn('export failed', e); }
}
function importBackup(file){
  var reader = new FileReader();
  reader.onload = function(){
    try {
      state = normalizeState(JSON.parse(reader.result));
      render(); scheduleSave();
    } catch(e){ console.warn('import failed', e); }
  };
  reader.readAsText(file);
}

app.addEventListener('change', function(e){
  var t = e.target;
  if (t.matches('[data-import-file]') && t.files && t.files[0]) importBackup(t.files[0]);
});

app.addEventListener('click', function(e){
  var el;
  if ((el = e.target.closest('[data-retry-sync]'))) { retrySync(); return; }
  if ((el = e.target.closest('[data-item-cycle]'))) { var refc = itemRefFromEl(el); var tc = findTaskByItemRef(refc); if (tc) tc.status = CYCLE[(CYCLE.indexOf(tc.status) + 1) % CYCLE.length]; render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-item-count]'))) { var refn = itemRefFromEl(el); var tn = findTaskByItemRef(refn); if (tn) tn.progress = (tn.progress + 1) % (tn.target + 1); render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-item-star]'))) { var refs = itemRefFromEl(el); var ts2 = findTaskByItemRef(refs); if (ts2) ts2.starred = !ts2.starred; render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-item-unschedule]'))) { var refu = itemRefFromEl(el); var tu2 = findTaskByItemRef(refu); if (tu2) tu2.date = ''; render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-item-del]'))) { var refd = itemRefFromEl(el); deleteItemByRef(refd); render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-mobile-nav-toggle]'))) { mobileNavOpen = true; render(); return; }
  if ((el = e.target.closest('[data-mobile-nav-close]'))) { mobileNavOpen = false; render(); return; }
  if ((el = e.target.closest('[data-mobile-nav-backdrop]'))) { mobileNavOpen = false; render(); return; }
  if ((el = e.target.closest('[data-export]'))) { exportBackup(); return; }
  if ((el = e.target.closest('[data-tab]'))) { state.selected.tab = el.dataset.tab; mobileNavOpen = false; render(); return; }
  if ((el = e.target.closest('[data-toggle-expand]'))) { var k = el.dataset.toggleExpand; uiExpanded[k] = !uiExpanded[k]; render(); return; }
  if ((el = e.target.closest('[data-goto-quarter]'))) { state.selected.quarterId = el.dataset.gotoQuarter; mobileNavOpen = false; render(); return; }
  if ((el = e.target.closest('[data-goto-month]'))) { state.selected.monthId = el.dataset.gotoMonth; mobileNavOpen = false; render(); return; }
  if ((el = e.target.closest('[data-goto-week]'))) { state.selected.weekId = el.dataset.gotoWeek; state.selected.tab = 'weekly'; mobileNavOpen = false; render(); return; }
  if ((el = e.target.closest('[data-goto-quarterly]'))) { state.selected.tab = 'quarterly'; mobileNavOpen = false; render(); return; }
  if ((el = e.target.closest('[data-cal-prev]'))) { state.selected.calMonth -= 1; if (state.selected.calMonth < 0) { state.selected.calMonth = 11; state.selected.calYear -= 1; } render(); return; }
  if ((el = e.target.closest('[data-cal-next]'))) { state.selected.calMonth += 1; if (state.selected.calMonth > 11) { state.selected.calMonth = 0; state.selected.calYear += 1; } render(); return; }
  if ((el = e.target.closest('[data-cal-day]'))) { var ds = el.dataset.calDay; state.selected.calDay = (state.selected.calDay === ds) ? null : ds; render(); return; }
  if ((el = e.target.closest('[data-cycle-week]'))) { var t = findTask(el.dataset.cycleWeek, el.dataset.cycleCluster, el.dataset.cycleTask); if (t) t.status = CYCLE[(CYCLE.indexOf(t.status) + 1) % CYCLE.length]; render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-count-week]'))) { var tc = findTask(el.dataset.countWeek, el.dataset.countCluster, el.dataset.countTask); if (tc) tc.progress = (tc.progress + 1) % (tc.target + 1); render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-star-week]'))) { var ts = findTask(el.dataset.starWeek, el.dataset.starCluster, el.dataset.starTask); if (ts) ts.starred = !ts.starred; render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-toggle-today]'))) {
    var tt = findTask(el.dataset.week, el.dataset.cluster, el.dataset.task);
    if (tt) tt.date = (tt.date === todayStr()) ? '' : todayStr();
    render(); scheduleSave(); return;
  }
  if ((el = e.target.closest('[data-move-next]'))) {
    var nid = nextWeekId(el.dataset.week);
    var srcTask = findTask(el.dataset.week, el.dataset.cluster, el.dataset.task);
    if (nid && srcTask) { copyTaskTo(srcTask, nid, el.dataset.cluster); render(); scheduleSave(); }
    return;
  }
  if ((el = e.target.closest('[data-del-task]'))) { var arr = state.weeks[el.dataset.week].tasks[el.dataset.cluster]; state.weeks[el.dataset.week].tasks[el.dataset.cluster] = arr.filter(function(t){ return t.id !== el.dataset.task; }); render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-toggle-backlog]'))) { var item = state.backlog[el.dataset.list].filter(function(i){ return i.id === el.dataset.item; })[0]; if (item) item.done = !item.done; render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-del-backlog]'))) { state.backlog[el.dataset.list] = state.backlog[el.dataset.list].filter(function(i){ return i.id !== el.dataset.item; }); render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-del-vision]'))) { state.visions = state.visions.filter(function(v){ return v.id !== el.dataset.delVision; }); render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-set-cluster-color]'))) { var cc = clusterById(el.dataset.cluster); if (cc) cc.color = el.dataset.color; render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-del-cluster]'))) {
    var cid = el.dataset.delCluster, key = 'cluster_' + cid;
    if (!confirmDelete[key]) { confirmDelete[key] = true; render(); setTimeout(function(){ confirmDelete[key] = false; render(); }, 4000); }
    else {
      state.clusters = state.clusters.filter(function(c){ return c.id !== cid; });
      Object.keys(state.weeks).forEach(function(wid){ delete state.weeks[wid].tasks[cid]; });
      Object.keys(state.quarterBridge).forEach(function(qid){ delete state.quarterBridge[qid][cid]; });
      confirmDelete[key] = false; render(); scheduleSave();
    }
    return;
  }
  if ((el = e.target.closest('[data-del-subcluster]'))) { var ccl = clusterById(el.dataset.cluster); if (ccl) { clearSubclusterRefs(ccl.id, el.dataset.subcluster); ccl.subclusters = ccl.subclusters.filter(function(s){ return s.id !== el.dataset.subcluster; }); } render(); scheduleSave(); return; }
  if ((el = e.target.closest('[data-del-goal]'))) { var qid2 = el.dataset.quarter, cid2 = el.dataset.cluster, gid = el.dataset.goal; state.quarterBridge[qid2][cid2].goals = state.quarterBridge[qid2][cid2].goals.filter(function(g){ return g.id !== gid; }); render(); scheduleSave(); return; }
});

app.addEventListener('input', function(e){
  var t = e.target;
  if (t.matches('[data-field="vision-title"]')) { var v = state.visions.filter(function(x){ return x.id === t.dataset.vision; })[0]; if (v) v.title = t.value; scheduleSave(); return; }
  if (t.matches('[data-field="vision-text"]')) { var v2 = state.visions.filter(function(x){ return x.id === t.dataset.vision; })[0]; if (v2) v2.text = t.value; scheduleSave(); return; }
  if (t.matches('[data-field="task-text"]')) { var task = findTask(t.dataset.week, t.dataset.cluster, t.dataset.task); if (task) task.text = t.value; scheduleSave(); return; }
  if (t.matches('[data-field="cluster-name"]')) { var cc2 = clusterById(t.dataset.cluster); if (cc2) cc2.name = t.value; scheduleSave(); return; }
  if (t.matches('[data-field="subcluster-name"]')) { var cc3 = clusterById(t.dataset.cluster); if (cc3) { var sc = cc3.subclusters.filter(function(s){ return s.id === t.dataset.subcluster; })[0]; if (sc) sc.name = t.value; } scheduleSave(); return; }
  if (t.matches('[data-field="goal-title"]')) { var g1 = state.quarterBridge[t.dataset.quarter][t.dataset.cluster].goals.filter(function(g){ return g.id === t.dataset.goal; })[0]; if (g1) g1.title = t.value; scheduleSave(); return; }
  if (t.matches('[data-field="backlog-url"]')) { var it = state.backlog[t.dataset.list].filter(function(x){ return x.id === t.dataset.item; })[0]; if (it) it.url = t.value; scheduleSave(); return; }
  if (t.matches('[data-item-field="text"]')) { var reft = itemRefFromEl(t); var tt2 = findTaskByItemRef(reft); if (tt2) tt2.text = t.value; scheduleSave(); return; }
});

app.addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  var t = e.target;
  if (t.matches('[data-new-task-input]')) {
    var val = t.value.trim();
    if (!val) return;
    var row = t.closest('.add-row');
    var targetInput = row ? row.querySelector('[data-new-task-target]') : null;
    var targetVal = targetInput && targetInput.value ? Math.max(1, parseInt(targetInput.value, 10) || 1) : 1;
    state.weeks[t.dataset.week].tasks[t.dataset.cluster].push({ id: uid(), text: val, status: 'none', starred:false, date:'', subclusterId: t.dataset.sub || '', target: targetVal, progress: 0 });
    if (targetInput) targetInput.value = '';
    render(); scheduleSave();
  } else if (t.matches('[data-new-daytask-input]')) {
    var val4 = t.value.trim();
    if (!val4) return;
    var dk = t.dataset.daykey;
    if (!state.dayTasks[dk]) state.dayTasks[dk] = [];
    state.dayTasks[dk].push({ id: uid(), text: val4, status: 'none', starred: false, target: 1, progress: 0 });
    render(); scheduleSave();
  } else if (t.matches('[data-new-backlog-input]')) {
    var val2 = t.value.trim();
    if (!val2) return;
    state.backlog[t.dataset.list].push({ id: uid(), text: val2, done: false, url:'' });
    render(); scheduleSave();
  } else if (t.matches('[data-cal-new-task]')) {
    var val3 = t.value.trim();
    if (!val3) return;
    var wrap = t.closest('.card');
    var sel = wrap ? wrap.querySelector('[data-cal-cluster]') : null;
    var clusterId = sel ? sel.value : state.clusters[0].id;
    var week = state.weeks[state.selected.weekId] ? state.selected.weekId : Object.keys(state.weeks)[0];
    state.weeks[week].tasks[clusterId].push({ id: uid(), text: val3, status:'none', starred:false, date: state.selected.calDay, subclusterId:'', target:1, progress:0 });
    render(); scheduleSave();
  } else if (t.matches('[data-new-vision-input]')) {
    var vt = t.value.trim();
    if (!vt) return;
    state.visions.push({ id: uid(), title: vt, text: '' });
    render(); scheduleSave();
  } else if (t.matches('[data-new-cluster-input]')) {
    var cn = t.value.trim();
    if (!cn) return;
    var newId = uid();
    var color = CLUSTER_COLORS[state.clusters.length % CLUSTER_COLORS.length];
    state.clusters.push({ id:newId, name:cn, color:color, subclusters:[] });
    Object.keys(state.weeks).forEach(function(wid){ state.weeks[wid].tasks[newId] = []; });
    Object.keys(state.quarterBridge).forEach(function(qid){ state.quarterBridge[qid][newId] = {goals:[]}; });
    render(); scheduleSave();
  } else if (t.matches('[data-new-subcluster-input]')) {
    var sn = t.value.trim();
    if (!sn) return;
    var ccl2 = clusterById(t.dataset.cluster);
    if (ccl2) ccl2.subclusters.push({ id: uid(), name: sn });
    render(); scheduleSave();
  } else if (t.matches('[data-new-goal-input]')) {
    var gn = t.value.trim();
    if (!gn) return;
    state.quarterBridge[t.dataset.quarter][t.dataset.cluster].goals.push({ id: uid(), title: gn });
    render(); scheduleSave();
  } else if (t.matches('[data-new-label]')) {
    var label = t.value.trim();
    if (!label) return;
    var action = t.dataset.add;
    if (action === 'quarter') {
      var qid = uid();
      state.quarters.push({id:qid, label:label});
      state.quarterBridge[qid] = emptyBridge(state.clusters);
      state.selected.quarterId = qid;
    } else if (action === 'month') {
      var mid = uid();
      var w1 = uid(), w2 = uid(), w3 = uid(), w4 = uid();
      [w1,w2,w3,w4].forEach(function(wid, i){ state.weeks[wid] = {label:'Week ' + (i+1), monthId:mid, tasks: emptyTaskMap(state.clusters)}; });
      state.months.push({id:mid, label:label, quarterId: state.selected.quarterId, weekIds:[w1,w2,w3,w4]});
      state.selected.monthId = mid;
    } else if (action === 'week') {
      var wid2 = uid();
      var month = state.months.filter(function(m){ return m.id === state.selected.monthId; })[0] || state.months[0];
      state.weeks[wid2] = {label: label, monthId: month.id, tasks: emptyTaskMap(state.clusters)};
      month.weekIds.push(wid2);
      state.selected.weekId = wid2;
    }
    render(); scheduleSave();
  }
});

init();
})();
</script>
